name: Generate school logo favicon

on:
  push:
    branches: [main]
    paths:
      - "src/images/bukana-logo.jpeg"
      - "scripts/generate-favicon.py"
      - ".github/workflows/generate-favicon.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-school-logo-favicon
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install logo conversion tools
        run: python -m pip install --disable-pip-version-check pillow vtracer

      - name: Convert the school logo into favicon assets
        run: python scripts/generate-favicon.py

      - name: Verify vector favicon output
        run: |
          grep -q "<svg" public/favicon.svg
          grep -q "<path" public/favicon.svg
          ! grep -q "<image" public/favicon.svg
          test "$(wc -c < public/favicon.svg)" -le 131072
          test -s public/apple-touch-icon.png

      - name: Commit generated favicon assets
        run: |
          if git diff --quiet -- public/favicon.svg public/apple-touch-icon.png; then
            echo "Favicon assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon.svg public/apple-touch-icon.png
          git commit -m "chore: generate school logo favicon"
          git push origin main
