name: Website quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Commit dependency lockfile updates
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Dependency lockfile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync npm dependency lockfile"
          git push

      - name: Verify clean locked dependency install
        run: npm ci --no-audit --no-fund

      - name: Lint source
        run: npm run lint

      - name: Build production assets
        run: npm run build

      - name: Smoke-test build output
        run: npm run test:smoke
