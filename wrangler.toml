name = "bukana-brilliant-schools"
main = "src/worker.js"
compatibility_date = "2026-11-06"

[assets]
directory = "dist"

# Custom domain (bukanabrilliantschools.com) is configured separately via the
# Cloudflare dashboard or `wrangler custom-domain add` once DNS is approved.
# Do not add wildcard/path route patterns for custom domains here.

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# Cloudflare's Wrangler key is "issues", not "issue_detection".
[observability.issues]
enabled = true
