name = "bukana-brilliant-schools"
main = "src/worker.js"
compatibility_date = "2026-11-06"
keep_vars = true

[assets]
directory = "dist"
binding = "ASSETS"

# Custom hostnames are managed separately in the Cloudflare dashboard.
# Keep custom-domain routes out of this file; do not add wildcard/path routes here.

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# Cloudflare's Wrangler key is "issues", not "issue_detection".
[observability.issues]
enabled = true
